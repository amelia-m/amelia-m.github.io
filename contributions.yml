# Work I contributed to without being a listed author, plus a few where I am
# one. The point is the analysis work: a lot of it lives in other people's
# theses and dissertations and is invisible from a publication list.
#
# NOT RENDERED ANYWHERE YET. This is the captured list, waiting on two things:
#
#   1. Titles, authors and years. digitalcommons.unl.edu does not resolve from
#      the build environment, so none of these could be read to fill them in.
#      They have to come from a machine that can reach the site, or by hand.
#   2. A decision about which groups belong on a public page at all. See the
#      note on `cited` below.
#
# Fields:
#   url      the DigitalCommons record
#   role     author | acknowledged | analysis | cited | unknown
#   title    to fill
#   authors  to fill
#   year     to fill
#   methods  for `analysis` entries: what was actually run. This is the part
#            worth having, since it is the evidence that the bios currently
#            lack, and it does not depend on being acknowledged by name.
#   quote    the acknowledgement wording, where there is one and it says
#            something more specific than "thanks to"
#   note     anything else

