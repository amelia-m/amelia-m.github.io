# Every record that turns up under my name, and what my actual relationship to
# each one is. The point is the analysis work: much of it lives in other
# people's theses and dissertations and is invisible from a publication list.
#
# Not everything here is a credential. The groups run from `author` down to
# `collegial` and `cited`, and the ones at that end exist precisely so a search
# hit does not get mistaken for a contribution later, by me or anyone else.
# Each group's comment says whether it belongs on a CV or a public page.
#
# Metadata here comes from the DigitalCommons search for "miramonti" (25 named
# records, of which four are a different L. Miramonti on Pierre Auger
# Collaboration papers and are not listed). My own dissertation and MA thesis
# are the other two of the 21 real hits; they live on dissertation.qmd.
#
# NOT RENDERED ANYWHERE YET. Two things are still open:
#
#   1. `methods`, the analyses actually run, and `quote`, the acknowledgement
#      wording. Neither can be read from the build environment, which cannot
#      resolve digitalcommons.unl.edu. They have to be filled from a machine
#      that can reach it. `methods` is the valuable half and does not depend
#      on being acknowledged by name.
#   2. Whether `cited` belongs on a public page. See the note on it below.
#
# Fields: url, title, authors, publication, date, then methods / quote / note.

