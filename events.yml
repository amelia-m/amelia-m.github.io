# Events shown on events.qmd and behind the home page callout.
#
# One source for both, so the home page cannot advertise something that has
# already happened. R/site.R reads this.
#
# `events` is a single list covering both halves of the page. An entry dated
# today or later is Upcoming; anything earlier is Past, newest year first.
# Nothing is moved by hand, so an event you attended stays on the page as a
# record of having attended it.
#
# Fields:
#   id        an id in links.yml, which supplies the label and the URL
#   date      ISO date; decides Upcoming vs Past and drives the callout
#   year      instead of `date`, for a past event whose exact day is not
#             recorded. Such entries sort after the dated ones in their year.
#   when      the date as it should read on the page
#   where     venue, optional
#   note      extra prose, optional, Markdown allowed
#   past_note replaces `note` once the event is past, for a note written
#             looking forward. Without it the `note` is kept as written.
#   more      further links.yml ids, shown in parentheses after the note
#   text      a whole line of Markdown, for an event with no links.yml entry
#   cadence   regulars only, in place of a date ("most Wednesday mornings")
#
# `note` is Markdown but not knitr source, so it cannot carry inline R: the
# page prints these with cat(), and knitr does not rescan what cat() emits.
# Use `more` for extra links instead of writing a link call here.

events:
  - id: wit-summit
    date: 2027-04-02
    when: Friday, April 2, 2027
    where: Kiewit La Vista, La Vista, NE
    note: >-
      I volunteered at the 2026 summit and am planning to volunteer again. The
      Nebraska Women in Tech Awards are the evening before, April 1, at the
      Kiewit Luminarium in Omaha.
  - id: nebraskajs
    date: 2026-10-15
    when: Thursday, October 15, 2026
    where: DevObsessed, Omaha, NE
    note: >-
      Joint with the first AI Engineer Omaha meetup. Two talks, the first on
      Jev, a narrow model that answers a typed question with a probability
      rather than with prose.
  - id: lincoln-code-2026-09-29
    date: 2026-09-29
  - text: >-
      posit::conf(2026). [Things I'm happy to talk
      about](posit-conf-2026.qmd).
    year: 2026
  - text: Nebraska Women in Tech Summit, event volunteer.
    year: 2026

regulars:
  - id: one-million-cups-lnk
    cadence: most Wednesday mornings
    note: >-
      Local founders present their businesses and take questions from the
      community.
    more:
      - id: one-million-cups-lnk-linkedin
        label: LinkedIn
  - id: lincoln-code
    note: A Lincoln meetup for people who write code.
  - id: lincoln-ai
    note: A Lincoln meetup about artificial intelligence.
  - id: nebraskajs
    cadence: monthly weekday evenings, usually Omaha
    note: >-
      Omaha's JavaScript community since 2009, these days as much about AI
      tooling. It comes down to Lincoln some months, sometimes jointly with
      Lincoln AI.
