# Events shown on events.qmd and behind the home page callout.
#
# One source for both, so the home page cannot advertise something that has
# already happened. R/site.R reads this.
#
# `events` is a single list covering both halves of the page. An entry dated
# today or later is Upcoming; anything earlier is Past, newest year first.
# Nothing is moved by hand, so an event you attended stays on the page as a
# record of having attended it.
#
# Fields:
#   id        an id in links.yml, which supplies the label and the URL
#   date      ISO date; decides Upcoming vs Past and drives the callout
#   year      instead of `date`, for a past event whose exact day is not
#             recorded. Such entries sort after the dated ones in their year.
#   when      the date as it should read on the page
#   where     venue, optional
#   note      extra prose, optional, Markdown allowed
#   past_note replaces `note` once the event is past, for a note written
#             looking forward. Without it the `note` is kept as written.
#   more      further links.yml ids, shown in parentheses at the end. Works on
#             a `text` entry too, which is how one of those carries a link
#             without the URL being written out here as a second copy.
#   text      a whole line of Markdown, for an event with no links.yml entry
#   cadence   regulars only, in place of a date ("most Wednesday mornings")
#
# `note` is Markdown but not knitr source, so it cannot carry inline R: the
# page prints these with cat(), and knitr does not rescan what cat() emits.
# Use `more` for extra links instead of writing a link call here.

events:
