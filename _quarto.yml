project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "!README.md"
  # Fails the render when the output shows a known symptom of breakage, such
  # as R writing an en dash as literal "<U+2013>" text: a render that only
  # "completes" once let exactly that through. See R/check-output.R.
  post-render: R/check-output.R
  # Before a whole-site render at a terminal, asks whether Amelia went to each
  # past event events.yml has not marked yet, so Past never claims one she
  # skipped. Asks nothing in preview or when no one is at the keyboard. See
  # R/confirm-attendance.R.
  pre-render: R/confirm-attendance.R
  # js/ is referenced from _includes/particles-bg.html and events.html, which
  # Quarto does not scan for resources, so name it here or it is left out of
  # _site.
  resources:
    - js/

execute:
  echo: false
  warning: false
  message: false

website:
  title: "Amelia Miramonti"
  site-url: https://amelia-m.github.io
  description: "Amelia Miramonti, PhD - research methodology, psychometrics, synthetic data, and R/Shiny tools for applied research."
  favicon: images/favicon.png
  open-graph: true
  twitter-card: true
  page-navigation: false
  navbar:
    # Ten links plus six icons do not fit beside the name at the default `lg`
    # (992px), which is what squeezed the brand and wrapped "Things I Like"
    # onto two lines. Collapse to the hamburger below 1200px instead. The
    # navbar rules in _shared.scss are written for this breakpoint (1200px,
    # and Quarto's own switch at 992px); change them together.
    collapse-below: xl
    left:
      - href: index.qmd
        text: Home
      - href: cv/index.qmd
        text: CV
      - text: Research
        menu:
          - href: research.qmd
            text: Research interests
          # In this menu rather than the top level: the bar already needs the
          # hamburger below 1200px with the items it has, and a menu entry
          # costs no width in the expanded bar.
          - href: dissertation.qmd
            text: Dissertation & theses
          - href: publications.qmd
            text: Publications
          - href: talks.qmd
            text: Talks & presentations
      - href: software.qmd
        text: Software
      - href: teaching.qmd
        text: Teaching
      - href: events.qmd
        text: Events
      - href: blog/index.qmd
        text: Blog
      - href: fun.qmd
        text: Fun
      - href: things-i-like.qmd
        text: Things I Like
      - href: contact.qmd
        text: Contact
    right:
      - icon: github
        href: https://github.com/amelia-m
        aria-label: GitHub
      - icon: linkedin
        href: https://www.linkedin.com/in/amelia-miramonti/
        aria-label: LinkedIn
      - icon: bluesky
        href: https://bsky.app/profile/ameliamiramonti.bsky.social
        aria-label: Bluesky
      - icon: twitter-x
        href: https://x.com/AmeliaMiramonti
        aria-label: X
      # Points at the contact page rather than a mailto:, which put a live
      # address in the navbar of all 13 pages for harvesters to read.
      - icon: envelope
        href: contact.qmd
        aria-label: Contact
  page-footer:
    left: "&copy; 2026 Amelia Miramonti"
    right: "Written in [R](https://www.r-project.org), stitched together with [Quarto](https://quarto.org), with assistance from [Claude](https://claude.ai) and [GitHub Copilot](https://github.com/features/copilot)."

format:
  html:
    theme:
      light: [cosmo, styles.scss]
      dark: [darkly, styles-dark.scss]
    toc: false
    smooth-scroll: true
    # Works, and cannot be checked by grepping the rendered HTML. Quarto
    # implements this as a DOMContentLoaded script in
    # share/formats/html/templates/quarto-html-after-body.ejs, so the
    # target attribute is added in the browser and never appears in the
    # file on disk. Verified in headless Chromium against the built site:
    # external links come out with target="_blank" rel="noopener".
    #
    # Two things look like failures and are not. Links to
    # amelia-m.github.io, such as the LSPC Weather app and the pleasantry
    # docs, are correctly treated as internal and open in the same tab.
    # Navbar and sidebar links are excluded by Quarto's own selector,
    # `a[href]:not(.nav-link):not(.navbar-brand):not(.toc-action)...`, so
    # the navbar GitHub icon also stays in the tab. Forcing either needs an
    # explicit target="_blank" on the link.
    link-external-newwindow: true
    # Analytics, on every page. index.qmd sets its own `include-after-body` for
    # the drifting-dot background; this is a different key, so a page-level
    # value cannot displace it.
    include-in-header: _includes/analytics.html
