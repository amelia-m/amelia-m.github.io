  # ---- Tools built outside a single project ------------------------------
  # The headline on the AI Engineer Omaha profile says the tools come out of
  # problems hit in the work. That is the claim these two entries should be
  # able to evidence, and currently cannot: which project prompted each is not
  # written down anywhere.
  - name: Recode Studio
    where: Own time
    when: ongoing
    current: true
    areas: [research]
    role: Author and maintainer, R and Shiny.
    output: >-
      Dataset-agnostic app for cleaning messy string variables without
      hand-writing R: browse values, flag likely typos, build and preview
      recode rules, export both a rule set and runnable code. Open source.
    # Read off the commit trailers in the repository, not from memory.
    built_with: >-
      Claude Code throughout: 37 co-author trailers across 45 commits, naming
      Opus 4.8, Opus 5, Sonnet 4.6, and Fable 5.1. No Copilot, Codex, or
      Gemini commits, and no bot-authored commits at all.
    todo: Which project's data prompted it.

  - name: Table Relationship Explorer
    where: Own time
    when: ongoing
    current: true
    areas: [research]
    role: Author and maintainer, R and Shiny.
    output: >-
      Multi-signal primary and foreign key inference with confidence scoring,
      interactive entity-relationship diagrams, and exportable reports across
      many file and database formats. Open source. See `note` below before
      describing the Python and Streamlit side of it.
    # Read off the commit trailers and git blame, not from memory.
    built_with: >-
      Claude Code dominant: 134 co-author trailers across 224 commits, mostly
      Opus 5 and Opus 5.5, with 37 commits authored by Claude directly.
      GitHub Copilot's coding agent wrote features here rather than only
      reviewing: 7 commits across 5 pull requests, including the golem package
      structure, composite-key sample data, and namespacing the DT and
      visNetwork calls. One passing mention of Codex, no Gemini anywhere.
    note: >-
      The Python and Streamlit port is Eugene Aiken's, and he carried it on as
      Cartographer at Common Gene Labs. Its README says I originally conceived
      and designed it, its NOTICE file says "original concept and design", and
      three of its source files carry "Original concept by" in their headers.
      I contributed its data privacy guide and local setup
      instructions. The arrangement runs both ways and only his side of it is
      currently written down anywhere.
      Worth stating properly rather than as "(with a Python/Streamlit port)",
      which says neither whose port it is nor that a lab picked the design up
      and shipped it. The second half is the part a reader would actually find
      interesting.
    todo: >-
      Which project's data prompted it. The NSWERS warehouse work is the
      obvious guess and is only a guess.
      Also: the published descriptions still say "(with a Python/Streamlit
      port)". The site's copy comes from _data/software_dev.json, which is
      generated, so that sentence has to change in the export repository.

