  - name: "WeCook: Food with Fun and Fitness"
    where: >-
      An after-school nutrition, cooking, and physical activity programme
      hosted by the Community Learning Centers (CLCs) associated with schools
      in Lincoln
    # My involvement, not the programme's own run, which is not recorded here.
    # It started after the autumn 2017 SNAP-Ed post, which was separate work.
    when: 2018 to 2019
    areas: [public-health, education, research]
    role: >-
      Measurement and analysis. The 2018 UNL master's thesis came out of this
      programme, along with five conference presentations.
    output: >-
      Thesis: Evaluation of the Feasibility of a Two-Method Measurement Design
      for the Assessment of Healthy Physical Activity Behavior in Youth, with a
      manuscript still in progress. Presentations on measurement invariance of
      a latent physical activity model across child surveys, parent surveys,
      and wearable tracker data (NSCA 2019); unidimensionality and reliability
      of step counts and floors climbed in 4th and 5th graders (ACSM 2019);
      self-reported healthy eating behaviour and nutrition knowledge
      (Nutrition 2019); a healthy-plate photo method for assessing nutrition
      knowledge (National Association of Extension 4-H Agents, 2018); and the
      programme evaluation itself (Nebraska Healthy Kids Summit 2019).
    note: >-
      The same partner organisation as Get in the Game, eight years earlier.
      That is the strongest continuity in the whole record, and the thing to
      reach for whenever a bio needs the range to read as one thread rather
      than a change of career.
      It is also the best-evidenced methods work on file: a latent model
      across three measurement modes, measurement invariance testing across
      them, and reliability analysis of the tracker data. No bio anywhere
      mentions any of it, which is the "all I do is clean data" problem in
      its most concrete form.

