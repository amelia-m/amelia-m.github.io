  - name: Nebraska Suicide Mortality Review
    where: University of Nebraska Public Policy Center
    when: 2025 to present
    current: true
    areas: [public-health, public-policy]
    role: Analysis, data management, and reporting. Lead developer of the review application.
    output: >-
      An R and Shiny application that reconciles successive Nebraska Violent
      Death Reporting System exports, tracks record-level changes between
      them, supports structured case annotation, and generates both the
      individual case reports and the annual report to the Legislature.
      Internal, not publicly released.
    note: >-
      The clearest example of the two areas being one project rather than two:
      the subject is health, the deliverable is a statutory report.

