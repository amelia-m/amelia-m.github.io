# The general areas the work falls in, and which projects sit in each.
#
# Two jobs. One: choosing which strands to name in a bio or a headline for a
# particular audience, which is what prompted this file. Two: somewhere to put
# a project that produced no publication, and so has no entry anywhere else.
# contributions.yml covers the published record; this covers the work.
#
# Renders nowhere, which is NOT the same as not published. This repository is
# public, so everything written here is world-readable the moment it is pushed,
# and git history keeps it even after an edit. Write nothing here that could not
# go on the site itself, in particular about other people.
#
# A project carries every area it belongs to, not one. Most of them straddle:
# the suicide mortality review is health data reported to a legislature. Run
# `work_areas()` from R/site.R to read it the other way round, by area.
#
# Project names and dates are quoted from the CV export in `_data/`, which is
# generated. Where one disagrees with the CV, the CV is right and this is
# stale. Not every entry has a CV line: the five logged from memory alone
# carry `source: recalled`, so an absent CV entry for them is expected
# rather than a sign the export is incomplete.
#
# This is deliberately incomplete and is being filled in backwards through the
# older positions. `todo` marks what is known to be missing; an absent project
# is not evidence it did not happen.
#
# Fields:
#   name     the project as it gets referred to
#   where    the centre, lab, or partner it sits under
#   when     years, or "ongoing"
#   current    true while it is live work, "unknown" when that is not established
#   areas    one or more ids from the `areas` block below
#   role     what I actually did on it
#   output   what came out of it: a report, an application, a paper
#   note       anything worth knowing later
#   built_with which assistants or tools did the building, read from the
#              repository's commit history rather than from memory
#   source     "recalled" for an entry with no CV line behind it
#   todo       what still needs filling in

areas:
  - id: research
    label: research
    scope: >-
      Methods and infrastructure whose users are other researchers:
      measurement, missing data, synthetic data for secondary analysis, and
      the tooling around a reproducible workflow. The line between this and
      the other three is who the work is for, not whether it is research. All
      of it is research.
  - id: public-policy
    label: public policy
    scope: >-
      Work commissioned by, or reported to, government: state agencies,
      municipal programmes, and statutory reporting.
  - id: public-health
    label: public health
    scope: >-
      Health outcomes and the services around them: care quality, nutrition,
      physical activity, and mortality review.
  - id: education
    label: education
    scope: >-
      Schools, students, and teaching, from the statewide education data
      system through to the graduate courses.

projects:
