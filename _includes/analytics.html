<!-- GoatCounter, pulled into every page by `include-in-header` in _quarto.yml.

     Chosen over Google Analytics because it sets no cookies and keeps no
     personal data, so the site needs no consent banner. That fits the rest of
     the privacy choices here: no published address, no live mailto: anywhere.

     Live since 2026-10-21, counting to the amelia-m GoatCounter account
     (dashboard: https://amelia-m.goatcounter.com). The script posts the URL
     of every page view to the subdomain it names, so that name must stay one
     this site owns; it shipped commented out until the account existed for
     that reason.

     On attributing traffic to a source: referrers arrive on their own, but
     social apps commonly mark outbound links rel="noreferrer", and links
     opened in a mobile in-app browser often carry no referrer at all, so
     visits from Bluesky or LinkedIn tend to be recorded as direct. Tagging the
     link is the reliable way:

         https://amelia-m.github.io/?utm_source=bluesky

     A campaign parameter takes precedence over the HTTP referrer. Recording it
     also needs Campaign Parameters switched on in the GoatCounter site
     settings; the script on its own does not capture it. -->

<script data-goatcounter="https://amelia-m.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
