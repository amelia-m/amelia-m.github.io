<!-- Skip link: hidden until focused (Bootstrap's visually-hidden-focusable),
     so keyboard users can pass the navbar's tab stops. Styled in _shared.scss.
     Quarto places include-before-body after the navbar, so the script moves
     the link to the start of <body> to make it the first tab stop. It also
     moves focus itself on activation: Quarto 1.10 rewrites in-page hrefs on
     index.html to "/#...", which reloads the page instead of skipping
     (quarto-dev/quarto-cli#14875). Quarto 1.11 adds its own skip link; remove
     this include when upgrading. -->
<a class="visually-hidden-focusable skip-link" id="skip-link" href="#quarto-document-content">Skip to main content</a>
<script>
  (function () {
    var a = document.getElementById("skip-link");
    if (!a) return;
    document.body.insertBefore(a, document.body.firstChild);
    a.addEventListener("click", function (e) {
      var t = document.getElementById("quarto-document-content");
      if (!t) return;
      e.preventDefault();
      if (!t.hasAttribute("tabindex")) t.setAttribute("tabindex", "-1");
      t.focus({ preventScroll: true });
      t.scrollIntoView();
    });
  })();
</script>
