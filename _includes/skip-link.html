<!-- Skip link: hidden until focused (Bootstrap's visually-hidden-focusable),
     so keyboard users can pass the navbar's tab stops. Styled in _shared.scss.
     Quarto places include-before-body after the navbar, so the script moves
     the link to the start of <body> to make it the first tab stop. -->
<a class="visually-hidden-focusable skip-link" id="skip-link" href="#quarto-document-content">Skip to main content</a>
<script>
  (function () { var a = document.getElementById("skip-link"); if (a) document.body.insertBefore(a, document.body.firstChild); })();
</script>
