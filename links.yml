# Public profile, contact, project, and event links: the single source for the
# home, contact, software, publications, events, fun, and conference pages
# (read through the link helpers in R/site.R).
#
# The navbar in _quarto.yml cannot read this file. Every render checks that
# each external navbar link also appears here and stops if one does not, so
# change a URL here and in _quarto.yml together.
#
# icon:    a Bootstrap Icons name (https://icons.getbootstrap.com), optional.
# icon_ai: an Academicons name (https://jpswalsh.github.io/academicons),
#          for the scholarly profiles Bootstrap Icons does not cover.

# Only the university address is published. The personal one was removed
# rather than obfuscated: nothing client-side stops a headless-browser
# scraper, so not publishing an address is the only measure that holds.
email:
  - id: email-unl
    label: University
    text: amiramonti2@unl.edu
    url: mailto:amiramonti2@unl.edu
    icon: envelope

