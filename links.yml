# Downstream work: someone else's repository that came out of one of mine.
# Kept out of `projects` above because that group is matched by label against
# the software_dev data, and this is not one of my projects.
related:
  # Confirmed public on 2026-10-17 by the cloud session's repository service,
  # which serves a repository anonymously only when it is public. A clone alone
  # did not show that: the session's git proxy adds Amelia's credentials, and
  # she contributes to this repository.
  #
  # Two related URLs are deliberately not here, because neither could be
  # checked: the deployed Streamlit app at cartographer.streamlit.app, and the
  # Common Gene Labs site linked from the Cartographer README. The build
  # environment's proxy refuses both hosts, which says nothing about whether
  # either is up; check them from a normal machine before linking.
  - id: cartographer
    label: Cartographer
    url: https://github.com/Common-Gene-Labs/cartographer
    icon: github

# Side projects, shown on fun.qmd. The `projects` group above is matched by
