  # 200 but renders "group you're looking for doesn't exist", and their
  # invitations now come from lu.ma. The home page carries the next meetup, so
  # it stays current between hand publishes in a way an event URL would not.
  - id: nebraskajs
    label: NebraskaJS
    url: https://nebraskajs.com/
  # The group that co-hosted the October 15 meetup, locally hosted by
  # DevObsessed. It is the Omaha chapter of an international organisation,
  # not a group founded here, so the parent has a footprint even though this
  # city site has almost none. An earlier version of this comment explained
  # the missing search results as a brand new group, which was wrong: only
  # the chapter is new.
  #
  # Confirmed live from the signed-in site. It still does not resolve from
  # the build environment, which is why the render cannot check it. The
  # chapter page rather than the per-event signup page, which goes stale
  # after the date.
  - id: ai-engineer-omaha
    label: AI Engineer Omaha
    url: https://omahaai.engineer/
  # The running notes pad for the monthly calls, which doubles as the regional
  # community's home: agendas, notes, and the connection details live there.
  #
  # Linked rather than the Zoom room itself. Not because that URL is secret,
  # since The Carpentries publish it on their own registration pages, but
  # because a room link is the wrong thing to put on a page nobody re-renders
  # often: it goes stale if the room changes, and signing up is the thing a
  # reader can act on. The per-date session pages are no better, since they go
  # away once the date passes. Hence this pad, and the pretix listing below.
  - id: carpentries-midwest
    label: US Midwest Carpentries Community
    url: https://pad.carpentries.org/local-us-midwest
  # Where every Carpentries community session is listed and registered for,
  # the regional calls and the Welcome Sessions alike. Logged here because the
  # individual session pages are per-date and go away after they happen.
  - id: carpentries-sessions
    label: The Carpentries community sessions
    url: https://pretix.carpentries.org/community-events/
