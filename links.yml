# Downstream work: someone else's repository that came out of one of mine.
# Kept out of `projects` above because that group is matched by label against
# the software_dev data, and this is not one of my projects.
related:
  # Verified by cloning this exact URL. A plain fetch of the page returns 403,
  # but every github.com request does from this environment, so that is the
  # proxy rather than the repository.
  #
  # Two related URLs are deliberately not here, because neither could be
  # checked: the deployed Streamlit app at cartographer.streamlit.app, and the
  # Common Gene Labs site linked from the Cartographer README. Both hosts are
  # unreachable from the build environment. areas.yml records them instead.
  - id: cartographer
    label: Cartographer
    url: https://github.com/Common-Gene-Labs/cartographer
    icon: github

# Side projects, shown on fun.qmd. The `projects` group above is matched by
# name against the software_dev data on software.qmd; this group is not, so
# it holds both the live app and its source.
fun:
  - id: lspc-weather
    label: LSPC Weather
    url: https://amelia-m.github.io/lspc-weather/
  - id: lspc-weather-source
    label: Source on GitHub
    url: https://github.com/amelia-m/lspc-weather
    icon: github
  # Same split as LSPC Weather above: the bare id is the thing to open, the
  # `-source` one is the code. The docs are built by the repo's pkgdown
  # workflow on every push to main and served from its gh-pages branch, so
  # this URL does not need republishing when the package changes.
  - id: pleasantry
    label: pleasantry
    url: https://amelia-m.github.io/pleasantry/
  - id: pleasantry-source
    label: Source on GitHub
    url: https://github.com/amelia-m/pleasantry
    icon: github
  # The workshop compliment was started in. Posit's catalogue titles it
  # "Our modern R workflow (ft. Positron and AI)"; the label here follows
  # the workshop materials' own heading.
  - id: modern-r-workflow
    label: Modern R workflow (ft. Positron and AI)
    url: https://github.com/posit-conf-2026/modern-r-workflow

