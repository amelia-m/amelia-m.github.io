    note: >-
      Separate from the profile README and shown in the sidebar beside it.
      146 of 160. "data cleaning, documentation" is missing its conjunction,
      and 14 spare characters is more than enough to fix it. The profile also
      shows pronouns, location, and the link row, none of which is this field.

