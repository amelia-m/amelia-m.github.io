  - id: ai-engineer-omaha
    label: AI Engineer Omaha member profile
    url: https://omahaai.engineer/me/profile
    # Governs `text` below, which is the Headline. Read off that input's
    # maxlength rather than counted off a screenshot.
    limit: 120
    updated: 2026-10-16
    text: >-
      I build tools for problems I come across in my own work in research,
      public policy, public health, and education
    note: >-
      The Headline field, "what you build, in one line", which is the only part
      of this profile saying anything a job title does not. Role and Company
      are separate inputs on the same form, currently "Postdoctoral Researcher
      & Adjunct Faculty" and "University of Nebraska", and the card shows those
      plus links out to GitHub and LinkedIn. Members only, so none of it is on
      the public web.
      112 of the 120 characters. The four areas are the ones in areas.yml, and
      are the reason this version has room: it replaced a claim that data
      quality limits model quality, which was true of everyone in the room and
      so distinguished nothing. No full stop, since a headline is a fragment.
      WORDING.md has the rejected versions.
      Earlier drafts named administrative data, which reads as though cleaning
      is the whole of the work. Naming the four areas is what keeps this one
      from reading that way, so do not trim it back to the tooling half.

  - id: github-bio
