  - id: bluesky
    label: Bluesky
    url: https://bsky.app/profile/ameliamiramonti.bsky.social
    limit: 256
    updated: 2026-10-13
    text: >-
      I make messy administrative data easier to document, clean, and report
      on, mostly in R and Shiny. Postdoc and adjunct faculty at UNL; survey
      methods, measurement, synthetic data, meta science. amelia-m.github.io
