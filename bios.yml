  - id: ai-engineer-omaha
    label: AI Engineer Omaha member profile
    url: https://omahaai.engineer/me/profile
    updated: 2026-10-16
    text: >-
      Postdoctoral Researcher & Adjunct Faculty, University of Nebraska.
    note: >-
      Set to members only, so it is not on the public web, and the directory
      card shows the role and company above plus links out to GitHub and
      LinkedIn. The Headline field, "what you build, in one line", is still
      empty: it is the only part of this profile that says anything a job
      title does not.
    draft_headline: R and Shiny tools that make messy data trustworthy
    # Paired with `draft_headline`, not written as `limit`: the Headline field
    # and the Role field are different inputs, and `limit` is checked against
    # `text`, which holds the role and company. Calling this one `limit` made
    # the report compare a 66 character role against the headline's cap.
    draft_limit: 120
    draft_note: >-
      Agreed but not yet entered on the site. Move it into `text` with the
      date once it is, and move draft_limit to `limit` at the same time.
      50 of the 120 characters, read off the input's maxlength. It carries no
      narrowing adjective, so it does not read as though administrative data
      is the whole of the work, and it answers what gets built rather than
      which models get fitted, because that is what the field asks for.

